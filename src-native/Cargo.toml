[package]
name = "xwx-deck-native"
version = "1.0.0"
edition = "2021"
publish = false

[features]
default = ["custom-protocol"]
custom-protocol = ["tauri/custom-protocol"]
manual-acceptance = []
update-validation = ["manual-acceptance"]

[build-dependencies]
zstd = { version = "0.13", default-features = false }
tauri-build = { version = "2", features = [] }
cc = "1"

[dependencies]
tauri = { version = "2", default-features = false, features = ["wry", "compression", "common-controls-v6", "tray-icon"] }
tauri-runtime = "2"
serde = { version = "1", features = ["derive"] }
serde_json = { version = "1", features = ["float_roundtrip"] }
serde_yaml_ng = "0.10"
regex = "1"
unicode-normalization = "0.1"
tokio = { version = "1", features = ["net", "sync", "time", "io-util", "rt-multi-thread", "process"] }
axum = { version = "0.8", default-features = false, features = ["http1", "tokio", "ws"] }
reqwest = { version = "0.12", default-features = false, features = ["native-tls", "system-proxy", "stream", "json", "http2", "native-tls-alpn"] }
toml_edit = "0.22"
futures-util = "0.3"
sha2 = "0.10"
ring = "0.17.14"
tauri-plugin-dialog = "2"
tauri-plugin-opener = "2"
tauri-plugin-autostart = "2"
base64 = "0.22"
getrandom = "0.3"
chacha20poly1305 = { version = "0.10", default-features = false, features = ["alloc"] }
zeroize = "1"
zstd = { version = "0.13", default-features = false }
jsonwebtoken = { version = "9.3", default-features = false }
chrono = { version = "0.4", default-features = false, features = ["std", "clock"] }
tokio-tungstenite = { version = "0.29", features = ["native-tls"] }
async-stream = "0.3"
rusqlite = { version = "0.40", features = ["backup", "hooks"] }
rusty-leveldb = { version = "4.0.1", default-features = false }

[target.'cfg(target_os = "macos")'.dependencies]
security-framework = "3.7"
block2 = "0.6.2"
objc2-foundation = { version = "0.3.2", default-features = false, features = ["NSDate", "NSSet", "NSString"] }
objc2-web-kit = { version = "0.3.2", default-features = false, features = ["WKWebView", "WKWebViewConfiguration", "WKWebsiteDataStore", "WKWebsiteDataRecord", "block2"] }

[target.'cfg(windows)'.dependencies]
rusqlite = { version = "0.40", features = ["backup", "bundled"] }
webview2-com = "0.39.1"
windows-core = "0.62.2"
windows = { version = "0.62.2", features = ["Foundation", "System", "Win32_System_WinRT", "Win32_System_Registry", "Win32_Storage_Packaging_Appx", "Win32_System_Com", "Win32_UI_Shell", "Win32_Storage_FileSystem"] }

[profile.release]
opt-level = "z"
lto = true
codegen-units = 1
panic = "abort"
strip = true

# Hash large debug fixtures without consuming the protocol's bounded read time.
# This override retains debug assertions and does not affect release builds.
[profile.test.package.sha2]
opt-level = 3
