name: 功能建议
description: 提议新的公开功能或兼容性改进
title: "[Feature] "
labels: [enhancement]
body:
  - type: textarea
    id: problem
    attributes:
      label: 需要解决的问题
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: 建议方案
    validations:
      required: true
  - type: textarea
    id: alternatives
    attributes:
      label: 替代方案
  - type: checkboxes
    id: scope
    attributes:
      label: 边界确认
      options:
        - label: 该建议不依赖未公开的内部服务或数据
          required: true
