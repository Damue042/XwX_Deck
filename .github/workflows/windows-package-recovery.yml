name: Complete exact Windows package acceptance

on:
  workflow_call:
    inputs:
      prior_run_id:
        required: true
        type: string

permissions:
  contents: read
  actions: read

jobs:
  recover:
    runs-on: windows-latest
    timeout-minutes: 45
    env:
      CARGO_TARGET_DIR: test-results/native-target
      XWX_PRIOR_NATIVE_RUN: ${{ inputs.prior_run_id }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - uses: dtolnay/rust-toolchain@stable
      - uses: actions/cache/restore@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            test-results/native-target
          key: ${{ runner.os }}-${{ runner.arch }}-native-rust-v3-${{ hashFiles('src-native/Cargo.lock') }}-${{ inputs.prior_run_id }}
          fail-on-cache-miss: true
      - uses: actions/download-artifact@v4
        with:
          name: windows-verification
          path: build-evidence
          run-id: ${{ inputs.prior_run_id }}
          github-token: ${{ github.token }}
      - name: Validate current verification sources
        run: npm run compile
      - name: Preserve exact tested executable and rebuild its installer
        run: node tools/native/recover-windows-package.mjs
      - name: Use only the exact staged executable for remaining checks
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force release-upload | Out-Null
          Copy-Item 'release/XwX Deck.exe' release-upload/XwX-Deck-windows-x64.exe
          "XWX_NATIVE_TEST_BINARY=$((Resolve-Path 'release-upload/XwX-Deck-windows-x64.exe').Path)" >> $env:GITHUB_ENV
      - name: Repeat strict private-file permissions three times
        shell: pwsh
        run: |
          $prior = Get-Content build-evidence/test-results/native-backend-summary.json -Raw | ConvertFrom-Json
          if (!$prior.passed) {
            foreach ($round in 1..3) {
              $env:XWX_NATIVE_TEST_REPORT = "test-results/private-files-round-$round.json"
              node tools/native/run-backend-tests.mjs --suite=credential-private-files-test.mjs
              if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
            }
            Remove-Item Env:XWX_NATIVE_TEST_REPORT
          }
          node tools/native/recover-windows-package.mjs --aggregate
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Prepare only the older executable fixture resources
        run: node tools/native/prepare.mjs
      - name: Verify actual Setup installation, upgrade and uninstall
        shell: pwsh
        run: |
          ./tools/native/ensure-windows-webview2.ps1
          node tools/native/windows-setup-fixture.mjs --output=test-results/setup-old-debug.exe
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          node tools/native/windows-setup-test.mjs --old-binary=test-results/setup-old-debug.exe --new-binary="release/XwX Deck.exe" --new-setup="release/XwX Deck Setup.exe"
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Verify actual native WebView interactions
        id: native-ui
        if: ${{ !cancelled() && env.XWX_NATIVE_TEST_BINARY != '' }}
        shell: pwsh
        run: |
          ./tools/native/ensure-windows-webview2.ps1
          node tools/native/native-test.mjs
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Diagnose window setup without modifying the candidate
        if: failure() && steps.native-ui.conclusion == 'failure'
        run: node tools/native/windows-window-probe.mjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: windows-verification
          path: |
            test-results/*.json
            test-results/*.log
            test-results/windows-setup-acceptance-*/summary.json
            test-results/windows-setup-acceptance-*/recovery-diagnostics.json
            test-results/windows-setup-acceptance-*/*.log
            release/native-build-report.json
          if-no-files-found: warn
      - name: Prepare verified release assets
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force release-upload | Out-Null
          Copy-Item "release/XwX Deck.exe" "release-upload/XwX-Deck-windows-x64.exe"
          Copy-Item "release/XwX Deck Setup.exe" "release-upload/XwX-Deck-windows-x64-setup.exe"
      - uses: actions/upload-artifact@v4
        with:
          name: windows-x64
          path: release-upload/*
          if-no-files-found: error

  installed-clients:
    needs: recover
    uses: ./.github/workflows/installed-client-acceptance.yml
    with:
      build_run_id: ${{ github.run_id }}
