name: Verify published update
on:
  workflow_dispatch:
    inputs:
      tag:
        description: Published release tag to verify (must be latest)
        required: true
        default: v1.0.0
permissions:
  contents: read
jobs:
  verify:
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, macos-15, macos-15-intel]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    env:
      CSC_IDENTITY_AUTO_DISCOVERY: "false"
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.tag }}
          fetch-depth: 0
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run compile
      - uses: dtolnay/rust-toolchain@stable
      - name: Verify anonymous native artifacts and physical updater
        env:
          RELEASE_TAG: ${{ inputs.tag }}
        run: node tools/native/published-artifact-test.mjs
      - name: Save actual update evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: published-update-${{ runner.os }}-${{ runner.arch }}
          path: test-results/
          if-no-files-found: error
